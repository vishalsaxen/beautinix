<title>Beautinix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: dark navy app shell (single deliberate dark theme). Header with brand + role chip, pill switch for the three sections,
   a highlight "next appointment" card, an icon tab row, then the working area. Phone-first; widens into grids on desktop. */
:root{
  color-scheme:dark;
  --bg:#0A111D; --surface:#111B2B; --surface-2:#172338; --raised:#1D2A42; --line:#25344E; --line-soft:#1C2940;
  --fg:#EEF2F9; --muted:#8C9BB4; --dim:#61708A;
  --accent:#F0479A; --accent-ink:#FFFFFF; --accent-soft:rgb(240 71 154 / .14); --accent-line:rgb(240 71 154 / .45);
  --gold:#F5A524; --gold-soft:rgb(245 165 36 / .14);
  --ok:#3DD68C; --ok-soft:rgb(61 214 140 / .13); --warn:#F5A524; --warn-soft:rgb(245 165 36 / .14); --bad:#F87171; --bad-soft:rgb(248 113 113 / .14);
  --logo-word:#F6D3E5; --logo-x:#E77BB3;
  --sans:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:18px; --r-sm:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.45rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);letter-spacing:.04em}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:3px solid var(--line-soft)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{height:58px;width:auto;display:block}
.brand-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:7px;border:1px solid}
.chip.live{color:var(--ok);background:var(--ok-soft);border-color:rgb(61 214 140 / .35)}
.site{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.site .ico{width:14px;height:14px;color:var(--ok)}
.top-actions{margin-left:auto;display:flex;gap:4px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--fg);display:grid;place-items:center}
.icon-btn:hover{background:var(--surface-2)}

.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Pill switch (sections) */
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:4px;padding:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;color:var(--fg);font-weight:600;padding:9px 18px;border-radius:11px;white-space:nowrap}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgb(240 71 154 / .3)}
.ghost-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--accent);font-weight:700;padding:10px 16px;border-radius:14px;margin-left:auto}
.ghost-btn:hover{border-color:var(--accent-line)}
.top-actions{align-items:center}
.top-actions .ghost-btn{padding:8px 12px;font-size:13px}
.contact{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;color:var(--muted)}
.contact a,.contact span{display:inline-flex;align-items:center;gap:6px;color:var(--fg);text-decoration:none}
.contact a:hover{color:var(--accent)}
.req{color:var(--accent)}
.wa-field,.price-field{display:flex;align-items:stretch}
.wa-field .cc,.price-field .cc{display:flex;align-items:center;padding:0 10px;background:var(--raised);border:1px solid var(--line);border-right:0;border-radius:12px 0 0 12px;color:var(--muted);font-weight:700}
.wa-field .input,.price-field .input{border-radius:0 12px 12px 0;min-width:0}
.price-field .input{width:96px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.avail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.avail-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 8px;font-weight:700;color:var(--muted)}
.avail-btn:disabled{cursor:default}
.avail-btn.a-available[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.avail-btn.a-busy[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.avail-btn.a-unavailable[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.svc-add{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:end;border-top:1px solid var(--line-soft);padding-top:12px}
.svc-list{display:flex;flex-direction:column;gap:6px}
.svc-list>span{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line-soft);padding-bottom:4px}
.price{color:var(--gold);font-weight:800}
.masked dd{font-family:var(--mono);letter-spacing:.2em;color:var(--dim)}
.salon-card h3 .sample{vertical-align:2px;margin-left:6px}
.salon-card a{color:var(--fg)}
@media (max-width:560px){.svc-add{grid-template-columns:minmax(0,1fr)}.avail-btn{padding:10px 4px;font-size:13px}}

.invite .code{font-size:1.9rem;font-weight:500;letter-spacing:.14em;color:var(--gold)}
.msg{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin:0;font-family:var(--sans);font-size:13px;color:var(--fg);overflow-wrap:anywhere}
a.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.small{font-size:12px;color:var(--muted)}
.ro{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
.ro dt{color:var(--muted)}.ro dd{margin:0;font-weight:600;overflow-wrap:anywhere}

.hint{font-weight:500;color:var(--dim)}
.field-err{color:var(--bad);font-size:12px;font-weight:600}
textarea.input{resize:vertical;min-height:90px}
.new-badge{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:2px}

/* Highlight card */
.next{display:flex;align-items:center;gap:18px;padding:18px;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(110deg,var(--raised),var(--surface) 70%);flex-wrap:wrap}
.next-tile{width:72px;height:72px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 6px 20px rgb(240 71 154 / .35);flex:none}
.next-tile b{font-size:1.7rem;font-weight:800}
.next-tile small{font-size:12px;font-weight:700;margin-top:3px}
.next-body{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.next-body h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-body p{color:var(--muted)}
.next-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tag{font-weight:700;color:var(--gold);background:var(--gold-soft);border:1px solid rgb(245 165 36 / .4);padding:6px 14px;border-radius:999px;white-space:nowrap}
.ref{color:var(--muted);font-size:12px}

/* Icon tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:4px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding-top:12px;padding-bottom:12px}
.tabs button{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:600;padding:9px 16px;border-radius:14px;white-space:nowrap;position:relative}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-current="page"]{background:var(--surface-2);border-color:var(--line);color:var(--accent)}
.tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}

/* Panels */
.pane{display:flex;flex-direction:column;gap:16px;min-width:0}
.pane-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pane-head p{color:var(--muted);margin-top:2px}
.sample{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:1px dashed var(--line);border-radius:8px;padding:4px 9px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel-head span{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:1.6rem;font-weight:800}
.kpi .d{font-size:12px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--gold)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.chart svg{width:100%;height:auto;display:block}
.list{display:flex;flex-direction:column}
.list-item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 0;border-top:1px solid var(--line-soft)}
.list-item:first-child{border-top:0}
.list-item .sub{color:var(--muted);font-size:12px}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:660px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:12px;color:var(--muted)}
.right{text-align:right}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-confirmed{background:var(--ok-soft);color:var(--ok)}
.s-pending{background:var(--warn-soft);color:var(--warn)}
.s-cancelled{background:var(--bad-soft);color:var(--bad)}
.s-checkedin{background:var(--accent-soft);color:var(--accent)}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}
.tools .input{width:auto}
.input:focus{border-color:var(--accent-line);outline:none}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 16px;font-weight:700}
.btn:hover{border-color:var(--accent-line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:10px}
.btn.block{width:100%;padding:12px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:0}
.row-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:flex-end}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0}
.card .meta dt{color:var(--muted)}.card .meta dd{margin:0}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.toggle{position:relative;width:40px;height:24px;border-radius:99px;border:0;background:var(--line);padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{left:19px}
.tier{font-size:12px;font-weight:800;color:var(--gold)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raised);border:1px solid var(--line);color:var(--fg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;box-shadow:0 10px 30px rgb(0 0 0 / .4)}

/* Login */
.auth{max-width:420px;width:100%;margin:12px auto;display:flex;flex-direction:column;gap:16px}
.auth .panel{padding:22px;gap:14px}
.auth .logo{height:120px;margin:0 auto}
.auth-head{text-align:center;display:flex;flex-direction:column;gap:4px}
.auth-head p{color:var(--muted)}
.pw{position:relative}
.pw .input{padding-right:64px}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:12px;font-weight:700}
.err{color:var(--bad);font-size:13px;font-weight:600}
.note{background:var(--gold-soft);border:1px solid rgb(245 165 36 / .35);color:var(--gold);border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
.note b{font-family:var(--mono);letter-spacing:.2em}

/* Salon timeline */
.timeline{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:24px 24px}
.tl{display:grid;min-width:760px;position:relative}
.tl .hcell{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:700}
.tl .hcell small{display:block;font-weight:500;color:var(--muted)}
.tl .hours{border-right:1px solid var(--line);background:var(--surface)}
.tl .hour{height:60px;font-size:12px;color:var(--dim);padding:2px 8px;border-bottom:1px dashed var(--line);font-family:var(--mono)}
.tl .col{position:relative;border-right:1px solid var(--line-soft)}
.appt{position:absolute;left:6px;right:6px;border-radius:10px;padding:6px 9px;font-size:12px;overflow:hidden;text-align:left;border:1px solid var(--accent-line);background:rgb(240 71 154 / .16);color:var(--fg)}
.appt b{display:block}
.appt span{color:var(--muted)}
.appt.checkedin{background:var(--ok-soft);border-color:rgb(61 214 140 / .45)}
.appt.pending{background:var(--warn-soft);border-color:rgb(245 165 36 / .45)}
.now{position:absolute;left:64px;right:0;height:2px;background:var(--gold);z-index:2;box-shadow:0 0 10px var(--gold)}

/* Guests */
.guest{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.steps span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps span.done{color:var(--accent);border-color:var(--accent-line)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.choice{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.choice:hover{border-color:var(--accent-line)}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice span{color:var(--muted);font-size:13px}
.choice .price{color:var(--gold);font-weight:800}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;text-align:center;min-width:62px}
.day small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] small{color:var(--accent-ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px;font-family:var(--mono)}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
.summary dt{color:var(--muted)}.summary dd{margin:0;font-weight:700}
.nav{display:flex;justify-content:space-between;gap:8px}
.ok-box{background:var(--ok-soft);border:1px solid rgb(61 214 140 / .35);color:var(--ok);border-radius:var(--r);padding:16px;font-weight:700}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .logo{height:46px}
  .site{display:none}
  .seg{width:100%}.seg button{flex:1;padding:9px 10px}
  .ghost-btn{margin-left:0}
  .top-actions .ghost-btn .lbl{display:none}
  .next-side{flex-direction:row;align-items:center;width:100%;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const otp=()=>String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);
async function hashPw(pw){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("beautinix:"+pw));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function newCode(){
  const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let c;
  do{c="BX-"+Array.from(crypto.getRandomValues(new Uint8Array(6)),n=>A[n%A.length]).join("")}while(SALONS.some(s=>s.code===c));
  return c;
}
function pwProblem(p,p2){
  if(p.length<8)return "Use at least 8 characters for the password.";
  if(p!==p2)return "The two passwords don't match.";

}

  const ff=$("#forgot-form");if(ff)ff.onsubmit=e=>{e.preventDefault();
    if($("#fp-id").value.trim().toLowerCase()!==ADMIN_ID){authErr="We don't have an admin account with that login ID.";renderAdmin();return}
    resetCode=otp();go("reset")};
  const rf=$("#reset-form");if(rf)rf.onsubmit=e=>{e.preventDefault();

let addErr={},addDraft={},lastInvite=null,confirmDel=null;
function invitePanel(s){

function aAdd(el){
  const v=k=>esc(addDraft[k]||"");
  const e=k=>addErr[k]?`<span class="field-err" role="alert">${addErr[k]}</span>`:"";
  const invited=SALONS.filter(s=>s.added).slice().reverse();

  el.innerHTML=head("Add Salon Details","Saving creates a unique code. Send it to the salon owner on WhatsApp so they can create their account in Salon de Beauté.")+
  (inv?invitePanel(inv):"")+`
  <form class="panel" id="add-form" novalidate style="max-width:760px">
    <div class="form-grid" style="align-items:start">
      <label class="f"><span>Salon name <span class="req">*</span></span><input class="input" id="ad-name" value="${v("name")}" placeholder="Glow Studio Bandra" required>${e("name")}</label>
      <label class="f"><span>Name of the person <span class="req">*</span></span><input class="input" id="ad-person" value="${v("person")}" placeholder="Ananya Sharma" autocomplete="name" required>${e("person")}</label>
      <label class="f"><span>WhatsApp number <span class="req">*</span></span>${waField("ad-wa",v("wa"))}${e("wa")}</label>
      <label class="f"><span>Email <span class="req">*</span> <span class="hint">(for password OTPs)</span></span><input class="input" id="ad-email" type="email" value="${v("email")}" placeholder="owner@glowstudio.in" autocomplete="email" required>${e("email")}</label>
      <label class="f"><span>State <span class="req">*</span></span><select class="input" id="ad-state" required><option value="">Select state</option>${STATES.map(x=>`<option${addDraft.state===x?" selected":""}>${x}</option>`).join("")}</select>${e("state")}</label>
      <label class="f"><span>City <span class="req">*</span></span><input class="input" id="ad-city" value="${v("city")}" placeholder="Mumbai" required>${e("city")}</label>
      <label class="f"><span>PIN code <span class="req">*</span></span><input class="input mono" id="ad-pin" inputmode="numeric" maxlength="6" value="${v("pin")}" placeholder="400050" required>${e("pin")}</label>
    </div>
    <div class="row"><button class="btn primary" type="submit">Save and send to Salon de Beauté</button><button class="btn" type="button" id="ad-clear">Clear</button></div>
  </form>
  ${invited.length?`<div class="panel"><div class="panel-head"><h3>Salons you've added</h3><span>${invited.length}</span></div><div class="list">
    ${invited.map(s=>`<div class="list-item"><div><b>${esc(s.name)}</b><div class="sub">${esc(s.person)} · ${esc(s.city)}, ${esc(s.state)} · <span class="mono">${s.code}</span></div></div>
      <div class="row-actions">${confirmDel===s.id?`<span class="err">Delete ${esc(s.name)} and its owner account?</span><button class="btn sm danger" data-delsalon="${s.id}">Delete</button><button class="btn sm" data-keep>Keep</button>`
        :`${s.status==="active"?`<span class="pill s-confirmed">Account created</span>`:`<span class="pill s-pending">Invite sent</span><a class="btn sm" href="${waLink(s)}" target="_blank" rel="noopener">Resend</a>`}<button class="btn sm" data-askdel="${s.id}">Delete</button>`}</div></div>`).join("")}
  </div></div>`:""}`;
  if(inv)$("#copy-msg").onclick=()=>copyText(inviteText(inv));
  bindDigits(el);
  el.querySelectorAll("[data-askdel]").forEach(b=>b.onclick=()=>{confirmDel=b.dataset.askdel;renderAdmin()});
  el.querySelectorAll("[data-keep]").forEach(b=>b.onclick=()=>{confirmDel=null;renderAdmin()});
  el.querySelectorAll("[data-delsalon]").forEach(b=>b.onclick=()=>{const id=b.dataset.delsalon,s=salon(id);
    const i=SALONS.indexOf(s);if(i>=0)SALONS.splice(i,1);saveAdded();
    BOOKINGS=BOOKINGS.filter(x=>x.salon!==id);saveBookings();
    if(lastInvite===id)lastInvite=null;confirmDel=null;renderAdmin();toast(`${s.name} and its owner account were deleted`)});
  const grab=()=>{addDraft={name:$("#ad-name").value.trim(),person:$("#ad-person").value.trim(),wa:waDigits($("#ad-wa").value),email:$("#ad-email").value.trim().toLowerCase(),
    state:$("#ad-state").value,city:$("#ad-city").value.trim(),pin:$("#ad-pin").value.trim()}};
  $("#ad-clear").onclick=()=>{addDraft={};addErr={};renderAdmin()};
  $("#add-form").onsubmit=ev=>{ev.preventDefault();grab();addErr={};
    const d=addDraft;
    if(!d.name)addErr.name="Enter the salon's name.";
    else if(SALONS.some(x=>x.name.toLowerCase()===d.name.toLowerCase()))addErr.name="A salon with this name already exists.";
    if(!d.person)addErr.person="Enter the name of the person for this salon.";
    const wa=waFmt(d.wa);
    if(waProblem(d.wa))addErr.wa=waProblem(d.wa);
    else if(SALONS.some(x=>x.wa===wa))addErr.wa="Another salon already uses this WhatsApp number.";
    if(emailProblem(d.email))addErr.email=emailProblem(d.email)+(d.email?"":" The owner gets password codes there.");
    else if(SALONS.some(x=>(x.email||"").toLowerCase()===d.email))addErr.email="Another salon already uses this email address.";
    if(!d.state)addErr.state="Choose the state.";
    if(!d.city)addErr.city="Enter the city.";
    if(!/^[1-9][0-9]{5}$/.test(d.pin))addErr.pin="Enter the 6-digit PIN code.";
    if(Object.keys(addErr).length){renderAdmin();return}
    const n={id:"s"+Date.now(),added:true,status:"invited",code:newCode(),name:d.name,person:d.person,wa,email:d.email,state:d.state,city:d.city,pin:d.pin,
      addr:`${d.city}, ${d.state} ${d.pin}`,chairs:"–",hours:"Not set yet",rating:"–",util:0,availability:"available",services:[]};
    SALONS.push(n);saveAdded();addDraft={};lastInvite=n.id;
    renderAdmin();
    // Open WhatsApp with the invite. Browsers may block this; the button in the panel always works.
    try{window.open(waLink(n),"_blank","noopener")}catch(e){}
    toast(`Saved. Code ${n.code} is ready to send to ${n.person}.`)};
}

let salonSel=store.get("bx-salon","ber");
let salonAuth="login",salonErr="",salonOtp=null,salonOtpFor=null,claimId=null;
function renderSalonAuth(el){
  const err=salonErr?`<p class="err" role="alert">${salonErr}</p>`:"";
  let body="";
  if(salonAuth==="login"){
    body=`<div class="auth-head"><h1>Salon sign-in</h1><p>See your salon's bookings for today.</p></div>
    <form class="panel" id="s-login" novalidate>
      <label class="f">Email<input class="input" id="sl-email" type="email" autocomplete="username" placeholder="owner@yoursalon.in" required></label>
      <label class="f">Password<input class="input" id="sl-pw" type="password" autocomplete="current-password" required></label>
      ${err}
      <button class="btn primary block" type="submit">Sign in</button>
      <button class="link" type="button" data-go="forgot">Forgot password?</button>
    </form>
    <div class="panel" style="align-items:center;text-align:center"><p>New salon? Use the code we sent you on WhatsApp.</p><button class="btn" type="button" data-go="claim">Create account</button></div>`;
  } else if(salonAuth==="claim"){
    body=`<div class="auth-head"><h1>Create your salon account</h1><p>Enter the unique code from your WhatsApp message.</p></div>
    <form class="panel" id="s-claim" novalidate>
      <label class="f">Unique code<input class="input mono" id="sc-code" placeholder="BX-7KQ2MP" autocapitalize="characters" required></label>
      ${err}
      <button class="btn primary block" type="submit">Continue</button>
      <button class="link" type="button" data-go="login">I already have an account</button>
    </form>`;
  } else if(salonAuth==="claim2"){
    const s=salon(claimId);
    body=`<div class="auth-head"><h1>${esc(s.name)}</h1><p>Check the details our team added, then choose your password.</p></div>
    <form class="panel" id="s-claim2" novalidate>
      <dl class="ro"><dt>Name</dt><dd>${esc(s.person)}</dd><dt>WhatsApp</dt><dd class="mono">${esc(s.wa)}</dd><dt>Email</dt><dd>${esc(s.email)}</dd><dt>Location</dt><dd>${esc(s.city)}, ${esc(s.state)} ${esc(s.pin)}</dd></dl>
      <p class="small">Something wrong? Ask the Beautinix team to correct it before you continue.</p>
      <label class="f">Password<input class="input" id="sc-pw" type="password" autocomplete="new-password" required></label>
      <label class="f">Repeat password<input class="input" id="sc-pw2" type="password" autocomplete="new-password" required></label>
      ${err}
      <button class="btn primary block" type="submit">Create account</button>
      <button class="link" type="button" data-go="claim">Use a different code</button>
    </form>`;
  } else if(salonAuth==="forgot"){
    body=`<div class="auth-head"><h1>Reset your password</h1><p>Enter your salon's email and we'll send a 6-digit code to it.</p></div>
    <form class="panel" id="s-forgot" novalidate>
      <label class="f">Email<input class="input" id="sf-email" type="email" autocomplete="username" placeholder="owner@yoursalon.in" required></label>
      ${err}
      <button class="btn primary block" type="submit">Send code</button>
      <button class="link" type="button" data-go="login">Back to sign-in</button>
    </form>`;
  } else {
    const s=salon(salonOtpFor);
    body=`<div class="auth-head"><h1>Choose a new password</h1><p>We sent a code to ${maskEmail(s.email)}. It's valid for 10 minutes.</p></div>
    <p class="note">Prototype: no email is sent. Your code is <b>${salonOtp}</b></p>
    <form class="panel" id="s-reset" novalidate>
      <label class="f">6-digit code<input class="input mono" id="sr-code" inputmode="numeric" maxlength="6" required></label>
      <label class="f">New password<input class="input" id="sr-pw" type="password" autocomplete="new-password" required></label>
      <label class="f">Repeat new password<input class="input" id="sr-pw2" type="password" autocomplete="new-password" required></label>
      ${err}
      <button class="btn primary block" type="submit">Save new password</button>
      <button class="link" type="button" data-go="login">Back to sign-in</button>
    </form>`;
  }
  el.innerHTML=`<div class="auth">${document.querySelector(".top .logo").outerHTML}${body}</div>`;
  const go=v=>{salonAuth=v;salonErr="";renderSalon()};
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  const fail=m=>{salonErr=m;renderSalon()};
  const byEmail=m=>SALONS.find(x=>x.added&&x.status==="active"&&(x.email||"").toLowerCase()===m.trim().toLowerCase());
  const f1=$("#s-login");if(f1)f1.onsubmit=async e=>{e.preventDefault();
    const s=byEmail($("#sl-email").value);

    sess.set("bx-salon-user",s.id);salonErr="";showSection("salon");toast(`Welcome, ${s.person}`)};
  const f2=$("#s-claim");if(f2)f2.onsubmit=e=>{e.preventDefault();
    const c=$("#sc-code").value.trim().toUpperCase().replace(/\s+/g,"");
    const s=SALONS.find(x=>x.code===c||x.code===("BX-"+c.replace(/^BX-?/,"")));
    if(!s)return fail("We can't find that code. Check it against your WhatsApp message.");
    if(s.status==="active")return fail("This code has already been used. Sign in with your email instead.");
    claimId=s.id;go("claim2")};
  const f3=$("#s-claim2");if(f3)f3.onsubmit=async e=>{e.preventDefault();
    const p=$("#sc-pw").value,m=pwProblem(p,$("#sc-pw2").value);if(m)return fail(m);
    const s=salon(claimId);s.pwHash=await hashPw(p);s.status="active";saveAdded();
    sess.set("bx-salon-user",s.id);salonAuth="login";salonErr="";showSection("salon");toast("Account created. You're signed in.")};
  const f4=$("#s-forgot");if(f4)f4.onsubmit=e=>{e.preventDefault();
    const s=byEmail($("#sf-email").value);
    if(!s)return fail("We don't have a salon account with that email.");
    salonOtpFor=s.id;salonOtp=otp();go("reset")};
  const f5=$("#s-reset");if(f5)f5.onsubmit=async e=>{e.preventDefault();
    if($("#sr-code").value.trim()!==salonOtp)return fail("That code isn't right. Check the 6 digits and try again.");
    const p=$("#sr-pw").value,m=pwProblem(p,$("#sr-pw2").value);if(m)return fail(m);
    const s=salon(salonOtpFor);s.pwHash=await hashPw(p);saveAdded();salonOtp=null;
    salonAuth="login";salonErr="";renderSalon();toast("Password changed. Sign in with your new password.")};
}
function renderSalon(){
  const el=$("#sec-salon");
  const me=salonUser();
  if(!me&&!isAdmin()){renderSalonAuth(el);return}
  // A salon owner sees only their salon; the signed-in admin can switch between salons.
  const s=me||salon(salonSel)||SALONS[0];const team=STAFF.filter(t=>t.salon===s.id);
  const start=9,end=20,hourPx=60,headH=58;
  const ap=APPTS.filter(a=>a.salon===s.id&&a.status!=="cancelled");
  const top=t=>mins(t)-start*60;
  el.innerHTML=(s.services?"":nextCard(ap,"Next guest · "+esc(place(s))))+`
  <div class="pane-head"><div><h1>${esc(s.name)}${s.added?'<span class="new-badge">New</span>':""}</h1><p>${s.services?`${esc(s.city)}, ${esc(s.state)} · ${availPill(s)}`:`Today · ${ap.length} appointments${team.length?" · tap one to check the guest in":""}`}</p></div>
    ${me?"":`<div class="tools"><select class="input" id="salon-pick" aria-label="Salon">${SALONS.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><span class="sample">Sample data</span></div>`}</div>
  <div class="panel"><div class="contact">
    ${s.person?`<span>${icon("user")}${esc(s.person)}</span>`:""}
    ${s.wa?`<a href="https://wa.me/${s.wa.replace(/[^0-9]/g,"")}" target="_blank" rel="noopener" class="mono">${icon("chat")}${esc(s.wa)}</a>`:""}
    ${s.email?`<span>${icon("mail")}${esc(s.email)}</span>`:""}
    ${s.added?`<span>${icon("store")}${esc(s.city)}, ${esc(s.state)} ${esc(s.pin)}</span>`:""}
  </div>${s.desc?`<p style="color:var(--muted)">${esc(s.desc)}</p>`:""}</div>
  ${s.services?ownerPanels(s,!!me&&me.id===s.id):`<div class="timeline"><div class="tl" style="grid-template-columns:64px repeat(${Math.max(team.length,1)},minmax(170px,1fr))">
    <div class="hcell hours" style="height:${headH}px"></div>${team.map(t=>`<div class="hcell" style="height:${headH}px">${t.name}<small>${t.role}</small></div>`).join("")||`<div class="hcell" style="height:${headH}px">No staff yet</div>`}
    <div class="hours">${Array.from({length:end-start},(_,i)=>`<div class="hour">${String(start+i).padStart(2,"0")}:00</div>`).join("")}</div>
    ${team.map(t=>`<div class="col" style="height:${(end-start)*hourPx}px">${ap.filter(a=>a.staff===t.id).map(a=>{const v=svc(a.svc);return `<button class="appt ${a.status}" style="top:${top(a.time)}px;height:${v.min-4}px" data-id="${a.id}"><b>${a.time} ${esc(a.guest)}</b><span>${v.name}${a.status==="checkedin"?" · checked in":a.status==="pending"?" · awaiting confirmation":""}</span></button>`}).join("")}</div>`).join("")}
    <div class="now" style="top:${headH+top(NOW)}px" aria-hidden="true"></div>
  </div></div>`}`;
  if(s.services)bindOwner(el,s);
  if(!me){$("#salon-pick").value=s.id;
    $("#salon-pick").onchange=e=>{salonSel=e.target.value;store.set("bx-salon",salonSel);renderSalon()}}
  el.querySelectorAll(".appt").forEach(b=>b.onclick=()=>{const a=APPTS.find(x=>x.id==b.dataset.id);
    if(a.status==="checkedin"){a.status="confirmed";toast(`${a.guest}: check-in undone`)}else{a.status="checkedin";toast(`${a.guest} checked in`)}renderSalon()});
}

const saveBookings=()=>{try{localStorage.setItem(BOOK_KEY,JSON.stringify(BOOKINGS))}catch(e){}};
let svcErr="";
function ownerPanels(s,editable){
  const mine=BOOKINGS.filter(b=>b.salon===s.id).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  return `<div class="grid2">

    ${editable?`<form id="svc-form" class="svc-add" novalidate>

  </div>
  <div class="panel"><div class="panel-head"><h3>Availability</h3>${availPill(s)}</div>
    <p class="small">Guests see this next to ${esc(s.name)} in die Gäste.</p>
    <div class="avail" role="group" aria-label="Availability">${Object.entries(AVAIL).map(([k,[l]])=>`<button class="avail-btn a-${k}" data-avail="${k}" aria-pressed="${(s.availability||"available")===k}" ${editable?"":"disabled"}>${l}</button>`).join("")}</div>
    <div class="panel-head" style="margin-top:8px"><h3>Bookings</h3><span>${mine.length}</span></div>
    ${mine.length?`<div class="list">${mine.map(b=>`<div class="list-item"><div><b>${esc(b.guest)}</b><div class="sub">${esc(b.service)} · ${inr(b.price)}</div></div><div class="right"><b class="mono">${fmt(new Date(b.date),{day:"numeric",month:"short"})} ${b.time}</b><div class="sub mono">${esc(b.wa)}</div></div></div>`).join("")}</div>`
      :`<p class="small">No bookings yet. They appear here when guests book.</p>`}
  </div></div>`;
}
function bindOwner(el,s){
  el.querySelectorAll("[data-avail]").forEach(b=>b.onclick=()=>{s.availability=b.dataset.avail;saveAdded();renderSalon();toast(`Guests now see: ${AVAIL[s.availability][0]}`)});
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{s.services=s.services.filter(v=>v.id!==b.dataset.del);saveAdded();renderSalon();toast("Service removed")});
  el.querySelectorAll("[data-price]").forEach(i=>i.onchange=()=>{const p=+i.value;const v=s.services.find(x=>x.id===i.dataset.price);
    if(!/^[0-9]{1,6}$/.test(i.value)||p<1){i.value=v.price;toast("Enter a price in whole rupees, for example 450");return}
    v.price=p;saveAdded();toast(`${v.name} is now ${inr(p)}`)});
  const f=$("#svc-form");if(f)f.onsubmit=e=>{e.preventDefault();
    const name=$("#sv-name").value.trim().replace(/\s+/g," "),pr=$("#sv-price").value.trim();
    svcErr=!name?"Enter the service name, for example Facial.":
      s.services.some(v=>v.name.toLowerCase()===name.toLowerCase())?`${name} is already on your list. Change its price above instead.`:
      !/^[0-9]{1,6}$/.test(pr)||+pr<1?"Enter the price in whole rupees, for example 450.":"";
    if(svcErr){renderSalon();$("#sv-name").value=name;$("#sv-price").value=pr;return}
    s.services.push({id:"v"+Date.now(),name:name[0].toUpperCase()+name.slice(1),price:+pr});saveAdded();renderSalon();toast(`${name} added at ${inr(+pr)}`)};
  bindDigits(el);
}

// ---------- die Gäste ----------
// Guests see each salon's name and availability. Everything else stays masked until they create an account.
const GUEST_KEY="bx-guests";
let GUESTS_ACC=[];try{GUESTS_ACC=JSON.parse(localStorage.getItem(GUEST_KEY)||"[]")}catch(e){}
const saveGuests=()=>{try{localStorage.setItem(GUEST_KEY,JSON.stringify(GUESTS_ACC))}catch(e){}};
const guestUser=()=>{const id=sess.get("bx-guest-user");return id?GUESTS_ACC.find(g=>g.id===id)||null:null};
let guestView="list",guestErr="",guestDraft={},guestOtp=null,guestOtpFor=null;
const gb={salon:null,svc:null,day:0,time:null,done:null};
function days(){const out=[];const d=new Date();d.setHours(0,0,0,0);for(let i=0;i<10;i++){const x=new Date(d);x.setDate(d.getDate()+i);out.push(x)}return out}
const fmt=(d,o)=>d.toLocaleDateString("en-GB",o);
const MASK="*****";
const listedSalons=()=>SALONS.filter(s=>s.services&&(s.sample||s.status==="active"));

function guestAuthView(){
  const err=guestErr?`<p class="err" role="alert">${guestErr}</p>`:"";
  const v=k=>esc(guestDraft[k]||"");
  if(guestView==="signup")return `<div class="auth-head"><h1>Create your guest account</h1><p>See salon services, prices and contact details, and book.</p></div>
    <form class="panel" id="g-signup" novalidate>
      <label class="f">Your name<input class="input" id="gs-name" value="${v("name")}" autocomplete="name" placeholder="Riya Mehta"></label>
      <label class="f">WhatsApp number${waField("gs-wa",v("wa"))}</label>
      <label class="f">Email<input class="input" id="gs-email" type="email" value="${v("email")}" autocomplete="email" placeholder="riya@gmail.com"></label>
      <label class="f">Password<input class="input" id="gs-pw" type="password" autocomplete="new-password"></label>
      <label class="f">Repeat password<input class="input" id="gs-pw2" type="password" autocomplete="new-password"></label>
      ${err}<button class="btn primary block" type="submit">Create account</button>
      <button class="link" type="button" data-gv="login">I already have an account</button></form>`;
  if(guestView==="login")return `<div class="auth-head"><h1>Guest sign-in</h1><p>Sign in to see salon details and book.</p></div>
    <form class="panel" id="g-login" novalidate>
      <label class="f">Email<input class="input" id="gl-email" type="email" autocomplete="username" placeholder="riya@gmail.com"></label>
      <label class="f">Password<input class="input" id="gl-pw" type="password" autocomplete="current-password"></label>
      ${err}<button class="btn primary block" type="submit">Sign in</button>
      <button class="link" type="button" data-gv="forgot">Forgot password?</button>
      <button class="link" type="button" data-gv="signup">New here? Create an account</button></form>`;
  if(guestView==="forgot")return `<div class="auth-head"><h1>Reset your password</h1><p>Enter your email and we'll send a 6-digit code to it.</p></div>
    <form class="panel" id="g-forgot" novalidate>
      <label class="f">Email<input class="input" id="gf-email" type="email" autocomplete="username"></label>
      ${err}<button class="btn primary block" type="submit">Send code</button>
      <button class="link" type="button" data-gv="login">Back to sign-in</button></form>`;
  const g=GUESTS_ACC.find(x=>x.id===guestOtpFor);
  return `<div class="auth-head"><h1>Choose a new password</h1><p>We sent a code to ${maskEmail(g.email)}. It's valid for 10 minutes.</p></div>
    <p class="note">Prototype: no email is sent. Your code is <b>${guestOtp}</b></p>
    <form class="panel" id="g-reset" novalidate>
      <label class="f">6-digit code<input class="input mono" id="gr-code" inputmode="numeric" maxlength="6"></label>
      <label class="f">New password<input class="input" id="gr-pw" type="password" autocomplete="new-password"></label>
      <label class="f">Repeat new password<input class="input" id="gr-pw2" type="password" autocomplete="new-password"></label>
      ${err}<button class="btn primary block" type="submit">Save new password</button>
      <button class="link" type="button" data-gv="login">Back to sign-in</button></form>`;
}
function salonCard(s,g){
  const off=(s.availability||"available")==="unavailable";
  return `<article class="card salon-card"><div class="panel-head"><h3>${esc(s.name)}${s.sample?' <span class="sample">Sample</span>':""}</h3>${availPill(s)}</div>
    ${g?`<dl class="meta"><dt>Location</dt><dd>${esc(s.city)}, ${esc(s.state)} ${esc(s.pin)}</dd><dt>WhatsApp</dt><dd><a class="mono" href="https://wa.me/${s.wa.replace(/[^0-9]/g,"")}" target="_blank" rel="noopener">${esc(s.wa)}</a></dd></dl>
      <div class="svc-list">${s.services.length?s.services.map(v=>`<span><span>${esc(v.name)}</span><b class="num">${inr(v.price)}</b></span>`).join(""):`<span class="small">No services listed yet</span>`}</div>
      <button class="btn primary" data-book="${s.id}" ${off||!s.services.length?"disabled":""}>${off?"Not taking bookings":"Book"}</button>`
    :`<dl class="meta masked"><dt>Location</dt><dd>${MASK}</dd><dt>WhatsApp</dt><dd>+91 ${MASK}</dd><dt>Services</dt><dd>${MASK}</dd><dt>Prices</dt><dd>₹ ${MASK}</dd></dl>
      <button class="btn" data-gv="signup">${icon("lock")} Create account to see details</button>`}
  </article>`;
}
function bookingView(g){
  const s=salon(gb.salon);
  if(gb.done){const b=gb.done;return `<div class="ok-box">You're booked at ${esc(s.name)} on ${fmt(new Date(b.date),{weekday:"long",day:"numeric",month:"long"})} at ${b.time}.</div>
    <div class="panel summary"><dl><dt>Service</dt><dd>${esc(b.service)}</dd><dt>Price</dt><dd class="num">${inr(b.price)}, paid at the salon</dd><dt>Salon WhatsApp</dt><dd class="mono">${esc(s.wa)}</dd></dl></div>
    <div class="nav"><span></span><button class="btn primary" id="gb-back">Back to salons</button></div>`}
  const busy=[["10:00","12:30","15:00"],["09:30","11:00","16:30"],["13:00","14:00","17:30"]][gb.day%3];
  const times=[];for(let h=9;h<19;h++)for(const m of["00","30"])times.push(`${String(h).padStart(2,"0")}:${m}`);
  const v=s.services.find(x=>x.id===gb.svc);
  return `<div class="pane-head"><div><h1>${esc(s.name)}</h1><p>${esc(s.city)} · ${availPill(s)}</p></div><button class="btn" id="gb-back">Back to salons</button></div>
    <h2>Choose a service</h2><div class="choices">${s.services.map(x=>`<button class="choice" data-svc="${x.id}" aria-pressed="${gb.svc===x.id}"><b>${esc(x.name)}</b><span class="price num">${inr(x.price)}</span></button>`).join("")}</div>
    <h2>Pick a day and time</h2>
    <div class="days">${days().map((d,i)=>`<button class="day" data-day="${i}" aria-pressed="${gb.day===i}"><small>${fmt(d,{weekday:"short"})}</small><b class="num">${d.getDate()}</b></button>`).join("")}</div>
    <div class="slots">${times.map(t=>{const n=new Date(),off=busy.includes(t)||(gb.day===0&&mins(t)<=n.getHours()*60+n.getMinutes());return `<button class="slot" data-time="${t}" aria-pressed="${gb.time===t}" ${off?"disabled":""}>${t}</button>`}).join("")}</div>
    <div class="panel summary"><dl><dt>Name</dt><dd>${esc(g.name)}</dd><dt>WhatsApp</dt><dd class="mono">${esc(g.wa)}</dd><dt>Service</dt><dd>${v?`${esc(v.name)} · ${inr(v.price)}`:"Choose a service"}</dd><dt>When</dt><dd>${gb.time?`${fmt(days()[gb.day],{weekday:"short",day:"numeric",month:"short"})}, ${gb.time}`:"Choose a time"}</dd></dl>
      <button class="btn primary block" id="gb-confirm" ${v&&gb.time?"":"disabled"}>Book appointment</button></div>`;
}
function renderGuests(){
  const el=$("#sec-guests");const g=guestUser();
  let body;
  if(!g&&guestView!=="list")body=`<div class="auth">${document.querySelector(".top .logo").outerHTML}${guestAuthView()}</div>`;
  else if(g&&gb.salon)body=`<div class="guest">${bookingView(g)}</div>`;
  else{const list=listedSalons();
    body=`<div class="guest">
    <div class="next"><div class="next-tile">${icon("store").replace('class="ico"','class="ico" style="width:30px;height:30px"')}</div><div class="next-body"><span class="eyebrow">${g?`Hi ${esc(g.name.split(" ")[0])}`:"Find a salon"}</span><h2>Salons on Beautinix</h2><p>${g?"Pick a salon to see its services and book.":"Create a free account to see services, prices and contact details."}</p></div>
      ${g?"":`<div class="next-side"><button class="btn primary" data-gv="signup">Create account</button><button class="link" data-gv="login">Sign in</button></div>`}</div>
    ${list.length?`<div class="cards">${list.map(s=>salonCard(s,g)).join("")}</div>`:`<p class="small">No salons yet. They appear here once the salon owner creates an account.</p>`}
    </div>`}
  el.innerHTML=body;
  el.querySelectorAll("[data-gv]").forEach(b=>b.onclick=()=>{guestView=b.dataset.gv;guestErr="";renderGuests();window.scrollTo(0,0)});
  bindDigits(el);
  const fail=m=>{guestErr=m;renderGuests()};
  const byEmail=m=>GUESTS_ACC.find(x=>x.email===m.trim().toLowerCase());
  const su=$("#g-signup");if(su)su.onsubmit=async e=>{e.preventDefault();
    guestDraft={name:$("#gs-name").value.trim(),wa:waDigits($("#gs-wa").value),email:$("#gs-email").value.trim().toLowerCase()};
    const d=guestDraft;
    const m=!d.name?"Enter your name.":waProblem(d.wa)||emailProblem(d.email)||(byEmail(d.email)?"An account with this email already exists. Sign in instead.":"")||pwProblem($("#gs-pw").value,$("#gs-pw2").value);
    if(m)return fail(m);
    const n={id:"g"+Date.now(),name:d.name,wa:waFmt(d.wa),email:d.email,pwHash:await hashPw($("#gs-pw").value)};
    GUESTS_ACC.push(n);saveGuests();guestDraft={};sess.set("bx-guest-user",n.id);guestView="list";guestErr="";showSection("guests");toast("Account created. Salon details are now visible.")};
  const li=$("#g-login");if(li)li.onsubmit=async e=>{e.preventDefault();
    const x=byEmail($("#gl-email").value);
    if(!x||x.pwHash!==await hashPw($("#gl-pw").value))return fail("That email and password don't match. Check them, or reset your password.");
    sess.set("bx-guest-user",x.id);guestView="list";guestErr="";showSection("guests");toast(`Welcome back, ${x.name.split(" ")[0]}`)};
  const fo=$("#g-forgot");if(fo)fo.onsubmit=e=>{e.preventDefault();
    const x=byEmail($("#gf-email").value);if(!x)return fail("We don't have a guest account with that email.");
    guestOtpFor=x.id;guestOtp=otp();guestView="reset";guestErr="";renderGuests()};
  const re=$("#g-reset");if(re)re.onsubmit=async e=>{e.preventDefault();
    if($("#gr-code").value.trim()!==guestOtp)return fail("That code isn't right. Check the 6 digits and try again.");
    const p=$("#gr-pw").value,m=pwProblem(p,$("#gr-pw2").value);if(m)return fail(m);
    const x=GUESTS_ACC.find(y=>y.id===guestOtpFor);x.pwHash=await hashPw(p);saveGuests();guestOtp=null;guestView="login";guestErr="";renderGuests();toast("Password changed. Sign in with your new password.")};
  el.querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>{Object.assign(gb,{salon:b.dataset.book,svc:null,day:0,time:null,done:null});renderGuests();window.scrollTo(0,0)});
  $("#gb-back")&&($("#gb-back").onclick=()=>{gb.salon=null;gb.done=null;renderGuests()});
  el.querySelectorAll("[data-svc]").forEach(b=>b.onclick=()=>{gb.svc=b.dataset.svc;renderGuests()});
  el.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{gb.day=+b.dataset.day;gb.time=null;renderGuests()});
  el.querySelectorAll("[data-time]").forEach(b=>b.onclick=()=>{gb.time=b.dataset.time;renderGuests()});
  $("#gb-confirm")&&($("#gb-confirm").onclick=()=>{const s=salon(gb.salon),v=s.services.find(x=>x.id===gb.svc),d=days()[gb.day];
    const b={id:"b"+Date.now(),salon:s.id,guest:g.name,wa:g.wa,email:g.email,service:v.name,price:v.price,date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`,time:gb.time};
    BOOKINGS.push(b);saveBookings();gb.done=b;renderGuests();window.scrollTo(0,0)});
}

showSection((location.hash||"#admin").slice(1));
</script>
